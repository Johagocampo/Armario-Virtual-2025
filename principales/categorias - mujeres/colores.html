<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventana con Opciones</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 0px;
            border-radius: 5px;
            text-align: center;
            
            
        }
        .close {
            cursor: pointer;
            color: red;
        }

        img{
            width: 300px;
            height: 300px;
        }


    </style>
</head>
<body>
    <button id="openModal">Abrir Ventana</button>
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Elige el tipo de sueter</h2>

            <img id="ima_gen" class="" src="imagenes/camisa11.jpg" alt="Texto">
            <img id="ima_gen" class="img-fluid" src="imagenes/buzo2.png" alt="Texto">
            <img id="ima_gen" class="img-fluid" src="imagenes/polo1.png" alt="Texto">
            
           
            
        </div>
    </div>
    <script>
        document.getElementById("openModal").addEventListener("click", function() {
            document.getElementById("myModal").style.display = "flex";
        });
        document.getElementById("closeModal").addEventListener("click", function() {
            document.getElementById("myModal").style.display = "none";
        });
    </script>
</body>
</html>
